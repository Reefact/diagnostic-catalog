name: sonar-profile

# Watches the SonarQube Cloud C# quality profile and reports when the repository has drifted from it.
#
# Why this exists. The rules the report is scored against live on the server, and nothing in the
# repository used to know what they were: the SonarAnalyzer NuGet package ships its own, narrower
# default set — measured here, it leaves S3776 disabled although the profile activates it, so the
# four methods the dashboard reported over the complexity threshold went unreported by the package
# until the rule was given an explicit severity. build/sonar-profile.globalconfig is that list,
# written down, generated by tools/sonar-profile/sync-profile.sh. A list written down once starts
# rotting the moment somebody edits the profile, and nobody would notice. This job is what notices.
#
# It REPORTS, it does not repair. The run fails with the diff, and a human regenerates the file.
# That is deliberate: the alternative is a scheduled job holding write access to the very file that
# governs which rules block a merge.
#
# A hand-edit of the generated file is caught by exactly the same mechanism, because a hand-edit is
# drift. There is no separate guard for it and none is needed.
#
# Weekly, not nightly: the profile is SonarSource's built-in "Sonar way" — nobody here has ever
# edited it and nobody can — so drift arrives with an analyzer release, a handful of times a year.

on:
  schedule:
    # Monday 04:47 UTC, ahead of the other weekly jobs (05:23 Scorecard, 06:17 CodeQL) and clear of
    # the nightly catalogue sync at 23:17.
    - cron: '47 4 * * 1'
  workflow_dispatch:

# Cancel superseded runs (a dispatch on top of a scheduled one).
concurrency:
  group: sonar-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Quality profile drift
    runs-on: ubuntu-latest
    # One checkout and two API calls; the cap only guards a hung request.
    timeout-minutes: 10
    # Declared per job so a job added later inherits nothing it did not ask for. This job reads the
    # checkout and calls a public API — nothing else.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare the committed rule list against the quality profile
        # The project is public, so the API answers unauthenticated and this job needs no secret.
        # SONAR_TOKEN is passed anyway, from the same secret sonar.yml uses: the day the project
        # stops being public, this keeps working instead of failing on a 403. A missing secret is
        # an empty string, which the script treats as "unauthenticated".
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: tools/sonar-profile/sync-profile.sh --check

      - name: Say what to do about it
        # Only on failure, and only as a pointer — the diff itself is already in the log above.
        if: failure()
        run: |
          # The backticks below are Markdown for the step summary, not command substitution, and
          # the single quotes are what keeps them literal. Same waiver, same reason, as the pull
          # request body built in nightly-catalogs.yml.
          # shellcheck disable=SC2016
          {
            echo '### SonarQube Cloud quality profile drift'
            echo
            echo 'The C# quality profile no longer matches `build/sonar-profile.globalconfig`.'
            echo 'The diff is in the previous step.'
            echo
            echo 'To resolve:'
            echo
            echo '1. Run `tools/sonar-profile/sync-profile.sh` and commit the regenerated file.'
            echo '2. The generated file puts every rule at `warning`, which the CI ratchet turns'
            echo '   into an error — so a rule the profile ADDED can turn the build red. That is'
            echo '   the point: it has to be dealt with deliberately rather than discovered later.'
            echo '3. Clear its violations, or park it in `.editorconfig` — `suggestion` with a'
            echo '   count for work not yet done, `none` with a reason for a rule this codebase'
            echo '   refuses. Either way the decision is written down where the next reader sees it.'
          } >> "$GITHUB_STEP_SUMMARY"
