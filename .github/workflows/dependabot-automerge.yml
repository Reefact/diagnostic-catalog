name: dependabot-automerge

# The low-friction lane of the Dependabot automation policy: for Dependabot PRs, enable
# GitHub auto-merge on patch and minor updates so they merge on their own once
# the required checks pass. Major updates are deliberately left untouched for
# human review.
#
# IMPORTANT — this workflow only *enables* auto-merge; it does not decide when to
# merge. GitHub merges the PR only once the branch's REQUIRED status checks pass.
# Without a branch-protection rule on `main` that marks the CI checks as required,
# auto-merge would merge immediately. The required checks are therefore the safety
# gate, not this workflow, and this workflow MUST NOT be relied upon on a branch
# that has none (ADR-0005).
#
# `main` is protected and its CI checks are required, so that condition holds and
# the workflow is live. It shipped behind a repository-variable switch while the
# protection rule did not yet exist; the switch has been removed rather than set,
# because it only ever covered the bootstrap window. Once armed it protected
# nothing: removing the branch-protection rule later would leave the switch on and
# the hazard back. The guarantee lives in the required checks, and nowhere else.
#
# ARMING PROCEDURE — two repository-level facts must hold, and neither implies the other:
#   1. `main` protected with the CI checks REQUIRED. This is what makes an armed merge
#      safe, and it is the whole subject of ADR-0005.
#   2. Settings -> General -> Pull Requests -> `Allow auto-merge` ENABLED. This is what
#      makes an armed merge possible at all: with it off, GitHub refuses
#      `enablePullRequestAutoMerge` outright and the arming step below fails.
# ADR-0005's follow-up actions name only the first, because the second is not a safety
# property and the decision is about safety. It is recorded here instead — that ADR points
# at this file for the procedure, and a prerequisite written down nowhere is one that gets
# discovered by a red check on someone else's pull request.
#
# WHAT THIS LANE CANNOT COVER, whatever the settings say: a pull request that changes a file
# under .github/workflows/. GitHub refuses `enablePullRequestAutoMerge` from a GitHub App
# token on such a pull request unless the token carries the `workflows` permission, and
# GITHUB_TOKEN cannot carry it — that permission is deliberately absent from the vocabulary a
# `permissions:` block accepts, so that no workflow can rewrite workflows. Only a PAT or an
# App installation token has it, and holding one in a repository secret would put a durable
# credential able to rewrite CI within reach of a job that runs on every Dependabot pull
# request. That is a worse trade than merging those by hand, and merging them by hand is what
# the refusal exists to obtain: a workflow diff is the one worth a human's eyes.
#
# The consequence is not marginal. `.github/dependabot.yml` runs two ecosystems, and every
# `github-actions` update changes .github/workflows/ by definition, so this lane serves the
# `nuget` half and no more. The step below therefore SKIPS what it cannot arm instead of
# failing on it: nobody could ever make that failure go green, and a check that can only be
# red is a check nobody reads.
#
# Why the job keys on the pull request's AUTHOR and not on `github.actor`. Auto-merge,
# once enabled, SURVIVES later pushes to the head branch. `github.actor` names whoever
# triggered the run, so a push by someone else made the job skip — leaving the
# auto-merge armed on a tip that nobody re-checked. The author of a pull request never
# changes, so keying on it means this job runs on EVERY event of a Dependabot pull
# request, including a push by someone else, which is precisely when it needs to act
# (the `bot-conditions` class of workflow-security finding).
#
# Identity is then settled twice, and the two answers do different work:
#   - `dependabot/fetch-metadata` re-checks the pull request's author and the FIRST
#     commit's signature (verified by reading the action's source; both its
#     skip-*-verification inputs default to false). It fails closed — no outputs, so
#     the steps below are skipped.
#   - The TIP check here is the one the action does not do. `fetch-metadata` validates
#     the first commit; auto-merge acts on the tip. Somebody with push access can append
#     to a Dependabot branch without changing either the author or the first commit.
#
# The two guards are deliberately asymmetric:
#   - ENABLING requires the strong proof — the tip is Dependabot's own GitHub-signed
#     commit. Commit author NAMES forge freely; GitHub's signature does not.
#   - DISABLING triggers on the weaker signal — the tip's author is not Dependabot —
#     because disabling is the fail-safe direction: at worst a human merges by hand.
#     Keying the disable on the SIGNATURE instead would disarm every branch Dependabot
#     itself rewrote on request (`@dependabot rebase`, `@dependabot recreate`): those
#     keep Dependabot as the author but drop the GitHub signature. That is what the
#     middle `dependabot-unsigned` state below is for — neither armed nor disarmed.

on:
  pull_request:
    branches:
      - main

# Least privilege by default; the job widens only what it needs.
permissions:
  contents: read

jobs:
  automerge:
    name: Auto-merge Dependabot patch/minor
    runs-on: ubuntu-latest
    # Fetch metadata + enable auto-merge is seconds; cap a stuck runner.
    timeout-minutes: 10
    # Only act on pull requests Dependabot OPENED — a fact no later push can change.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      # Enable auto-merge (contents) on the pull request (pull-requests).
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      - name: Inspect the head commit this event is about
        id: tip
        # Reads the tip the checks actually ran against, not whatever the branch points at
        # by the time this job runs. A newer push raises its own event and re-enters here.
        # Fail closed: anything unreadable answers "not Dependabot's", which only ever
        # withholds or withdraws auto-merge.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}" \
            --jq '"\(.author.login // "")|\(.commit.verification.verified)"' 2>/dev/null || true)"
          author="${tip%%|*}"
          echo "head ${HEAD_SHA}: author='${author:-unknown}' signed='${tip##*|}'"
          # Signed by Dependabot — the strong proof, required to ARM auto-merge.
          if [ "$tip" = "dependabot[bot]|true" ]; then
            echo "state=dependabot-signed" >> "$GITHUB_OUTPUT"
          # Authored by Dependabot but unsigned: what a `@dependabot rebase` or `recreate`
          # leaves behind. Not proof enough to arm, not foreign enough to disarm — leave
          # whatever is already set alone.
          elif [ "$author" = "dependabot[bot]" ]; then
            echo "state=dependabot-unsigned" >> "$GITHUB_OUTPUT"
          else
            echo "state=foreign" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask whether this pull request changes a workflow
        id: scope
        # Answers the limit stated in this file's header: a pull request touching
        # .github/workflows/ cannot be armed by this job's token, so the arming step below
        # declines to try rather than failing on something no setting can fix.
        #
        # Asked of the CHANGED FILES and not of `package-ecosystem`, because the two are not the
        # same question. The `github-actions` ecosystem also updates composite actions under
        # .github/actions/, which are not workflow files and arm perfectly well; keying on the
        # ecosystem would withhold the lane from those for no reason.
        #
        # Fail closed: an unreadable answer counts as a workflow change, which only ever
        # withholds auto-merge — the direction that is always safe (see the disable step below).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # Counted by jq inside gh rather than grepped out of a listing: `grep -q` closes the
          # pipe on its first match, which under `pipefail` reports the whole pipeline as failed
          # exactly when it matched — the one case that must not read as "no workflow touched".
          if changed="$(gh pr view "$PR_URL" --json files \
            --jq '[.files[].path | select(startswith(".github/workflows/"))] | length' 2>&1)"; then
            echo "${changed} changed file(s) under .github/workflows/"
          else
            printf '%s\n' "$changed"
            echo 'Could not read the changed files; counting this as a workflow change.'
            changed=1
          fi
          if [ "$changed" -gt 0 ]; then
            echo 'changes-a-workflow=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changes-a-workflow=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Note that a workflow change is merged by hand
        # Not a failure, and deliberately not a step summary either: this is the ordinary
        # outcome for every `github-actions` update, and an alarm raised on the ordinary
        # outcome is noise. The log is where a reader who wonders why nothing was armed looks.
        if: steps.scope.outputs.changes-a-workflow == 'true'
        run: |
          echo 'This pull request changes a file under .github/workflows/.'
          echo 'GITHUB_TOKEN cannot arm auto-merge on such a pull request, and no repository'
          echo 'setting changes that — see the header of .github/workflows/dependabot-automerge.yml.'
          echo 'Nothing is wrong here; the pull request is merged by hand once its checks are green.'

      - name: Enable auto-merge for patch and minor updates
        # Major updates fall through this condition, so they never get auto-merge
        # and stay open for a human to review.
        if: >-
          steps.tip.outputs.state == 'dependabot-signed' &&
          steps.scope.outputs.changes-a-workflow == 'false' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Still fails when it cannot arm — the lane is dead until someone acts, and a warning
        # on a pull request nobody is reading is not someone acting. What it stops doing is
        # failing on a bare GraphQL string that names no switch: `Allow auto-merge` off is not
        # a fault of the pull request under test, it is prerequisite 2 of the procedure in this
        # file's header, and it will paint EVERY patch and minor update red until it is set.
        # Any other error is left exactly as it comes out, because it means something else.
        run: |
          set -euo pipefail
          if out="$(gh pr merge --auto --merge "$PR_URL" 2>&1)"; then
            printf '%s\n' "$out"
            exit 0
          fi
          printf '%s\n' "$out"
          case "$out" in
            *'Auto merge is not allowed for this repository'*)
              echo "::error title=Auto-merge is switched off for this repository::Enable Settings -> General -> Pull Requests -> Allow auto-merge, then re-run this job."
              # The backticks below are Markdown for the step summary, not command substitution, and
              # the single quotes are what keeps them literal. Same waiver, same reason, as the drift
              # summary in sonar-profile.yml.
              # shellcheck disable=SC2016
              {
                echo '### Auto-merge is switched off for this repository'
                echo
                echo 'This pull request is fine. The repository is not configured to accept an armed'
                echo 'merge, so there is nothing this workflow can do from here.'
                echo
                echo 'Enable **Settings → General → Pull Requests → Allow auto-merge**, then re-run'
                echo 'this job. It is prerequisite 2 of the arming procedure at the top of'
                echo '`.github/workflows/dependabot-automerge.yml`; prerequisite 1 — `main` protected'
                echo 'with its CI checks required — is already in place and is what keeps the merge'
                echo 'safe (ADR-0005).'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          exit 1

      - name: Withdraw auto-merge from a foreign head
        # The step that closes the gap: auto-merge armed on Dependabot's own commit stays
        # armed across later pushes, so a commit appended by someone with push access would
        # ride an approval it never got. Withdrawing is idempotent — `|| true` because the
        # call errors when auto-merge was not enabled in the first place, which is the
        # ordinary case here.
        if: steps.tip.outputs.state == 'foreign'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Head is not Dependabot's commit; withdrawing auto-merge so a human decides."
          gh pr merge --disable-auto "$PR_URL" || true
