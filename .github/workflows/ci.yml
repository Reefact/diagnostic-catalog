name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only checks out and builds/tests, so the token
# needs nothing beyond read access to the repository contents.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Fail a hung run fast instead of holding a runner to the 6-hour default.
    timeout-minutes: 15
    strategy:
      # Run both legs to completion so a platform-specific failure is always visible.
      fail-fast: false
      matrix:
        # The library ships netstandard2.0 assemblies that .NET Framework consumers load on
        # Windows and .NET consumers load everywhere, so both platforms are exercised.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The solution is DISCOVERED, never named. A hardcoded file name would have to be edited
      # the day the solution is created or renamed, and the workflow would fail with a path error
      # rather than a useful message. `dotnet` itself resolves the single solution in the working
      # directory, so the steps below pass no solution argument at all; this step only decides
      # whether there is anything to build yet, so the repository can carry its CI before it
      # carries its first project.
      - name: Locate the solution
        id: solution
        shell: bash
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 \( -name '*.sln' -o -name '*.slnx' \) | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No solution at the repository root yet; build and test are skipped."
          elif [ "$count" -gt 1 ]; then
            echo "::error::Found $count solutions at the repository root; 'dotnet build' cannot pick one."
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        if: steps.solution.outputs.present == 'true'
        run: dotnet restore

      - name: Build
        if: steps.solution.outputs.present == 'true'
        run: dotnet build -c Release --no-restore

      # DiagnosticCatalog.Self is generated from this repository's OWN analyzers, so unlike the three
      # vendor catalogues it goes stale through an ordinary pull request rather than an upstream
      # release: add a DCAT id, forget to regenerate, and the catalogue silently stops describing the
      # analyzer that ships beside it. The nightly sync would fix it a day later, on main, which is a
      # day of main saying two different things.
      #
      # Regenerating needs the analyzer built, which the step above has just done. Only the ubuntu leg
      # runs it — the check is about file content, and the same diff on two platforms is noise.
      #
      # This restates the self catalogue that eng/catalogs.json already declares, because the manifest
      # holds four and the other three fetch from NuGet: running it whole here would download three
      # packages and rewrite three files to check one. The restatement is the cost of that, and it has
      # to spell the source the SAME WAY the manifest does — the two produce different bytes
      # otherwise, and the guard would fail on a difference between its own two callers rather than on
      # a stale catalogue. That is why --project appears twice below: the first belongs to `dotnet
      # run` and names the tool, the second belongs to `dcat generate` and names what it reads.
      - name: The self catalogue is in step with the analyzers
        if: steps.solution.outputs.present == 'true' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/DiagnosticCatalog.Cli -c Release --no-build -v minimal -- generate \
            --project src/DiagnosticCatalog.Analyzers/DiagnosticCatalog.Analyzers.csproj \
            --configuration Release \
            --namespace DiagnosticCatalog.Self \
            --container DcatRule \
            --output src/DiagnosticCatalog.Self/DcatRules.g.cs
          if ! git diff --quiet -- src/DiagnosticCatalog.Self/DcatRules.g.cs; then
            echo "::error::DcatRules.g.cs is stale. Regenerate it with:"
            echo "::error::  dotnet run --project src/DiagnosticCatalog.Cli -- generate --manifest eng/catalogs.json"
            git --no-pager diff -- src/DiagnosticCatalog.Self/DcatRules.g.cs
            exit 1
          fi

      - name: Test
        if: steps.solution.outputs.present == 'true'
        # Collect OpenCover coverage via coverlet.collector (configured in coverage.runsettings).
        # Reports land under artifacts/coverage/<guid>/coverage.opencover.xml, ready for a Sonar scan.
        run: >-
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --results-directory artifacts/coverage
          --logger "console;verbosity=normal"

      - name: Upload coverage report
        if: steps.solution.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Per-OS name so the two matrix legs do not clash when uploading.
          name: coverage-${{ matrix.os }}
          path: artifacts/coverage/**/coverage.opencover.xml
          # `error`, not `warn`: coverage that silently stops being produced is exactly the
          # failure this artifact exists to make visible. A solution whose test projects do not
          # collect coverage turns this red on purpose.
          if-no-files-found: error

  # build-test above runs the suite on the LATEST .NET (10). This job proves the library's OTHER
  # supported runtime: that the netstandard2.0 assemblies actually load and pass their tests on
  # .NET Framework 4.7.2. netstandard2.0 is only a COMPILE contract; running on the real .NET
  # Framework CLR (NLS globalization, the netstandard.dll facade, its reflection stack) is what
  # proves the library behaves there, and the ordinary net10 build cannot. .NET Framework tests run
  # on Windows only (there is no Mono on the Linux legs), and the net472 inner build is gated behind
  # EnableNet472Floor (build/Net472TestFloor.props) so it never touches build-test.
  diagnostic-floor:
    name: Diagnostics the ratchet cannot see
    runs-on: ubuntu-latest
    # One build and one jq pass; the cap only guards a hung run.
    timeout-minutes: 20
    # Declared per job so a job added later inherits nothing it did not ask for. This one reads the
    # checkout and builds it — nothing else.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The gap this closes is not a rule, it is a SEVERITY. The warning ratchet promotes warnings
      # to errors, so nothing that warns can merge — but a Roslyn diagnostic reported below warning
      # prints nothing in a build at any verbosity, never reaches the ratchet, and is imported by
      # SonarQube Cloud all the same. Measured: 23 such diagnostics produced a green build and 23
      # issues on the dashboard, rule for rule (ADR-0022).
      #
      # It runs as its own job rather than inside build-test because it needs its own build: the
      # compiler only writes the diagnostic log this reads when asked, and asking changes what every
      # project produces. Keeping it separate leaves the build the matrix measures untouched.
      - name: Check that nothing is reported below warning
        run: tools/analysis/check-diagnostic-floor.sh

      - name: Say what to do about it
        # The offending diagnostics are already in the log above, each with its file, line and
        # message; this is the pointer, not a repeat.
        if: failure()
        run: |
          # The backticks below are Markdown for the step summary, not command substitution, and the
          # single quotes are what keeps them literal. Same waiver, same reason, as the pull request
          # body built in nightly-catalogs.yml.
          # shellcheck disable=SC2016
          {
            echo '### Diagnostics reported below warning'
            echo
            echo 'These do not fail the build and SonarQube Cloud imports them anyway, so they reach'
            echo 'the dashboard behind a green pull request. The previous step names each one.'
            echo
            echo 'Each needs one of three answers:'
            echo
            echo '1. Clear the violation.'
            echo '2. Raise the rule to warning severity in `.editorconfig`, so the ratchet owns it'
            echo '   from now on and the next one fails the build that writes it.'
            echo '3. Suppress it at the site, with the reason, where the next reader will meet it.'
          } >> "$GITHUB_STEP_SUMMARY"

  framework-floor:
    name: Library on the .NET Framework 4.7.2 floor
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # global.json pins the .NET 10 SDK; that SDK compiles the net472 target. The .NET Framework
      # runtime that RUNS net472 assemblies ships on the windows-latest image, and the net472
      # targeting pack for COMPILATION is supplied hermetically by the
      # Microsoft.NETFramework.ReferenceAssemblies package — so no extra install.
      - name: Setup .NET (build SDK)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Membership is declared by each project, not listed here. A project joins the floor by
      # importing build/Net472TestFloor.props (CONTRIBUTING.md, "The .NET Framework floor"), so a
      # new test project is enrolled by its own csproj and this job needs no edit — and a project
      # that leaves the floor cannot be forgotten in a list here.
      #
      # A per-project loop, not a solution-wide `-f net472`: the latter would force the TFM onto
      # the net10-only projects and fail.
      #
      # The pattern is anchored on the <Import> ELEMENT, not on the file name alone. A bare name
      # match also finds the name written in prose — and the first project to explain in a comment
      # why it deliberately stays OFF the floor enrolled itself by saying so, then failed with
      # NETSDK1005 because it has no net472 target. Matching the construct rather than the string
      # means a project is enrolled by what it does, never by what it says about itself.
      - name: Test the netstandard2.0 libraries on .NET Framework 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          # bin/ and obj/ are skipped: a project file copied into a build output is an ordinary
          # .csproj to a tree-wide grep, and the copy would be tested from a path with no restore
          # behind it. Membership is a property of the source tree, as it is for the release trains
          # (tools/trains.sh, projects_of).
          projects="$(grep -rlE '<Import[^>]*Net472TestFloor\.props' \
            --include='*.csproj' --exclude-dir=bin --exclude-dir=obj . || true)"
          if [ -z "$projects" ]; then
            echo "::notice::No project imports build/Net472TestFloor.props yet; the floor has nothing to run."
            exit 0
          fi
          for proj in $projects; do
            echo "::group::$proj (net472)"
            dotnet test "$proj" -c Release -f net472 -p:EnableNet472Floor=true \
              --logger "console;verbosity=normal"
            echo "::endgroup::"
          done
