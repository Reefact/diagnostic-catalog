name: Nightly catalogue sync

# Regenerates every catalogue in eng/catalogs.json from its upstream analyzer package and
# opens a pull request when something actually changed.
#
# It never publishes. Per doc/specification.en.md §14.2 the output of this job is a pull
# request carrying a rules diff for human review, because a category or an id that moved
# upstream is a change to a published contract — and because the platform never validates
# a suppression's category (§3.2), a wrong value merged here would produce no symptom
# anywhere.

on:
  schedule:
    # 23:17 UTC — 01:17 in Paris in summer, 00:17 in winter, since cron is UTC and this
    # repository's maintainer is not. The drift across daylight saving is accepted: nothing
    # here is time-critical.
    #
    # Early in the night rather than late, because GitHub schedules on a best-effort basis
    # and can run a job hours after its slot — the first occurrence of this one fired three
    # hours late. What the hour buys is that even a long delay still lands overnight, so the
    # pull request is waiting at the start of the day rather than arriving during it. It is
    # not a correction for the delay: the same hour is the better one even when the
    # scheduler is punctual.
    #
    # The minute stays off the hour, and for its own reason: jobs at :00 queue behind
    # everybody else's, which is the delay this cannot afford to add to.
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      force-pr:
        description: 'Open a pull request even if nothing changed (for testing the job)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One sync at a time. Two overlapping runs would race on the same branch.
  group: catalog-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/catalog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Regenerate catalogues
        id: generate
        run: |
          set -euo pipefail
          dotnet run --project src/DiagnosticCatalog.Cli -c Release -v minimal -- generate \
            --manifest eng/catalogs.json \
            --summary "$RUNNER_TEMP/summary.md"

          if [ -n "$(git status --porcelain -- src/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          # WHICH trains moved, not just whether anything did. Merging this pull request
          # publishes nothing, so until each affected train is tagged, main and the package
          # on nuget.org describe different rule sets — with nothing anywhere to say so. The
          # pull request body names the trains and the command, so the next step is written
          # down at the moment it becomes necessary rather than remembered later.
          #
          # Computed here, while the changes are still unstaged and attributable to a
          # directory; by the time the body is written they are one commit.
          # shellcheck source=tools/trains.sh
          . tools/trains.sh
          trains=''
          for train in $(train_ids); do
            for project in $(projects_of "$train"); do
              if [ -n "$(git status --porcelain -- "$(dirname "$project")")" ]; then
                trains="${trains}${trains:+ }${train}"
                break
              fi
            done
          done
          echo "trains=$trains" >> "$GITHUB_OUTPUT"
          echo "trains touched: ${trains:-none}"

          {
            echo "## Catalogue sync"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # A regeneration that does not build is a signal, not something to paper over: it
      # means upstream changed shape. Fail before opening a pull request.
      - name: Build and verify
        if: steps.generate.outputs.changed == 'true'
        run: dotnet build -c Release --nologo

      # The generator leaves files untouched when nothing moved, so a second run over the
      # freshly written files must report no change at all. If it does not, the output is
      # not deterministic and every future run would churn the diff.
      - name: Check the output is stable
        if: steps.generate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cp -r src "$RUNNER_TEMP/src-first"
          dotnet run --project src/DiagnosticCatalog.Cli -c Release -v minimal -- generate \
            --manifest eng/catalogs.json
          if ! diff -r "$RUNNER_TEMP/src-first" src > "$RUNNER_TEMP/stability.diff"; then
            echo "::error::Regeneration is not deterministic; a second run changed the output."
            head -50 "$RUNNER_TEMP/stability.diff"
            exit 1
          fi

      - name: Open or update the pull request
        if: steps.generate.outputs.changed == 'true' || inputs.force-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty when force-pr opened a pull request with nothing changed, which is why the
          # reminder below is written only when it is not.
          TRAINS: ${{ steps.generate.outputs.trains }}
        run: |
          set -euo pipefail
          # shellcheck source=tools/trains.sh
          . tools/trains.sh
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout -B "$SYNC_BRANCH"
          git add -- src/
          if git diff --cached --quiet; then
            echo 'Nothing staged; force-pr was requested with no changes. Skipping.'
            exit 0
          fi

          SUMMARY="$(cat "$RUNNER_TEMP/summary.md")"
          git commit -q -m "chore: sync generated catalogues with upstream analyzers" \
                        -m "$SUMMARY"

          # The catalogue content is derived, so the latest regeneration always wins over
          # whatever the branch held before.
          git push --force-with-lease origin "$SYNC_BRANCH"

          # Quoted heredocs ('EOF'), so the body is written verbatim: it is Markdown, and its
          # backticks and $ signs must reach the pull request rather than be read as command
          # substitutions. The summary is interleaved between the two because it is a file the
          # generator wrote, not a literal.
          #
          # Every line here — heredoc bodies and terminators included — sits at this block's
          # own indentation, which YAML strips wholesale: that is what puts the terminators in
          # column 1 for the shell and leaves the Markdown unindented. A line dedented past it
          # does not merely look wrong, it ends the block scalar and the file stops parsing.
          BODY_FILE="$RUNNER_TEMP/body.md"
          cat > "$BODY_FILE" <<'EOF'
          Regenerated from the upstream analyzer packages by the nightly catalogue
          sync workflow (`.github/workflows/nightly-catalogs.yml`).

          **Review this diff, do not merge it blind.** A category or an id that moved
          upstream changes a published contract, and because the .NET platform never
          reads a suppression's category, a wrong value merged here would produce no
          symptom anywhere (specification §3.2).

          EOF
          cat "$RUNNER_TEMP/summary.md" >> "$BODY_FILE"
          # The release reminder. Built with printf rather than a heredoc because it
          # interpolates the train names, and the quoted heredocs above exist precisely to
          # stop interpolation: single-quoted printf formats keep backticks and $ literal
          # while %s carries the values in.
          #
          # Tags are fetched explicitly — actions/checkout does not bring them, and without
          # them every train would report "never published" on a repository that has in fact
          # published all four.
          # SC2016 fires on every backtick and $ inside these single-quoted formats, which is
          # precisely what they are for: the backticks are Markdown and must reach the pull
          # request as characters, not be read as command substitution. Disabling it here is
          # the same call the quoted heredocs above make, for the same reason.
          # shellcheck disable=SC2016
          if [ -n "$TRAINS" ]; then
            git fetch --tags --force --quiet origin
            {
              printf '\n### After merging\n\n'
              printf 'Merging this publishes nothing. Until each train below is tagged, `main`\n'
              printf 'and the package on nuget.org describe different rule sets, and no check\n'
              printf 'anywhere reports the gap.\n'
            } >> "$BODY_FILE"
            for train in $TRAINS; do
              prefix="$(prefix_of "$train")"
              package="$(basename "$(projects_of "$train")" .csproj)"
              latest="$(git tag --list "${prefix}*" --sort=-v:refname | head -1)"
              {
                printf '\n**`%s`** — last published: `%s`\n\n' "$train" "${latest:-none}"
                printf '    git tag -a %sX.Y.Z -m "%s X.Y.Z"\n' "$prefix" "$package"
                printf '    git push origin %sX.Y.Z\n' "$prefix"
              } >> "$BODY_FILE"
            done
            printf '\nThe version is left blank on purpose: whether a sync is a patch or a minor\n' >> "$BODY_FILE"
            printf 'depends on what actually moved, and a pre-filled number invites pasting.\n' >> "$BODY_FILE"
          fi

          cat >> "$BODY_FILE" <<'EOF'

          ---

          - Ids and categories are read from each analyzer's own `DiagnosticDescriptor`
            instances, never from documentation (§14.1).
          - Rules retired upstream are kept and marked `[Obsolete]`, never deleted:
            consumers inline constants, so removing one breaks their recompilation (§23.1).
          - No package is published by this job.
          EOF

          if gh pr view "$SYNC_BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr edit "$SYNC_BRANCH" \
              --title 'chore: sync generated catalogues with upstream analyzers' \
              --body-file "$BODY_FILE"
            echo "Updated existing pull request."
          else
            gh pr create \
              --head "$SYNC_BRANCH" \
              --title 'chore: sync generated catalogues with upstream analyzers' \
              --body-file "$BODY_FILE"
          fi

      - name: Report no change
        if: steps.generate.outputs.changed != 'true'
        run: echo 'Every upstream package still resolves to the version already mirrored. Nothing to do.'
