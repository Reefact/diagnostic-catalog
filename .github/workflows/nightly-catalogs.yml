name: Nightly catalogue sync

# Regenerates every catalogue in eng/catalogs.json from its upstream analyzer package and
# opens a pull request when something actually changed.
#
# It never publishes. Per doc/specification.en.md §14.2 the output of this job is a pull
# request carrying a rules diff for human review, because a category or an id that moved
# upstream is a change to a published contract — and because the platform never validates
# a suppression's category (§3.2), a wrong value merged here would produce no symptom
# anywhere.

on:
  schedule:
    # 23:17 UTC — 01:17 in Paris in summer, 00:17 in winter, since cron is UTC and this
    # repository's maintainer is not. The drift across daylight saving is accepted: nothing
    # here is time-critical.
    #
    # Early in the night rather than late, because GitHub schedules on a best-effort basis
    # and can run a job hours after its slot — the first occurrence of this one fired three
    # hours late. What the hour buys is that even a long delay still lands overnight, so the
    # pull request is waiting at the start of the day rather than arriving during it. It is
    # not a correction for the delay: the same hour is the better one even when the
    # scheduler is punctual.
    #
    # The minute stays off the hour, and for its own reason: jobs at :00 queue behind
    # everybody else's, which is the delay this cannot afford to add to.
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      force-pr:
        description: 'Open a pull request even if nothing changed (for testing the job)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One sync at a time. Two overlapping runs would race on the same branch.
  group: catalog-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/catalog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # One manifest entry — DiagnosticCatalog.Self — reads an analyzer assembly already on disk
      # rather than a NuGet package, because the analyzer it mirrors ships from this repository. On a
      # fresh runner that assembly does not exist yet, and the generator stops on a missing file
      # rather than quietly emitting a catalogue short of rules. So it is built first.
      - name: Build the analyzers the self catalogue is read from
        run: dotnet build src/DiagnosticCatalog.Analyzers/DiagnosticCatalog.Analyzers.csproj -c Release --nologo

      - name: Regenerate catalogues
        id: generate
        run: |
          set -euo pipefail
          dotnet run --project src/DiagnosticCatalog.Cli -c Release -v minimal -- generate \
            --manifest eng/catalogs.json \
            --summary "$RUNNER_TEMP/summary.md"

          if [ -n "$(git status --porcelain -- src/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          # WHICH trains moved, not just whether anything did. Merging this pull request
          # publishes nothing, so until each affected train is tagged, main and the package
          # on nuget.org describe different rule sets — with nothing anywhere to say so. The
          # pull request body names the trains and the command, so the next step is written
          # down at the moment it becomes necessary rather than remembered later.
          #
          # Only a train whose RULES moved is tagged. A train whose mirrored upstream version
          # moved and nothing else changes no published rule, so it moves no version
          # (specification §14.2, ADR-0015): its new CatalogSource reaches consumers with the
          # next release that has something to say. The two lists are kept apart so the body
          # can say which is which instead of leaving every changed train looking taggable.
          # A train counts as "rules moved" when its generated file differs by anything beyond
          # the provenance stamp: the header comment, sourceVersion and generatedOn.
          #
          # Computed here, while the changes are still unstaged and attributable to a
          # directory; by the time the body is written they are one commit.
          # shellcheck source=tools/trains.sh
          . tools/trains.sh
          trains=''
          mirror_only=''
          for train in $(train_ids); do
            for project in $(projects_of "$train"); do
              dir="$(dirname "$project")"
              if [ -n "$(git status --porcelain -- "$dir")" ]; then
                if [ -n "$(git diff -U0 -- "$dir"/*.g.cs | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vE '^[+-]//|sourceVersion:|generatedOn:' || true)" ]; then
                  trains="${trains}${trains:+ }${train}"
                else
                  mirror_only="${mirror_only}${mirror_only:+ }${train}"
                fi
                break
              fi
            done
          done
          echo "trains=$trains" >> "$GITHUB_OUTPUT"
          echo "mirror_only=$mirror_only" >> "$GITHUB_OUTPUT"
          echo "trains to tag: ${trains:-none}"
          echo "mirror only, not tagged: ${mirror_only:-none}"

          {
            echo "## Catalogue sync"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # A regeneration that does not build is a signal, not something to paper over: it
      # means upstream changed shape. Fail before opening a pull request.
      - name: Build and verify
        if: steps.generate.outputs.changed == 'true'
        run: dotnet build -c Release --nologo

      # The generator leaves files untouched when nothing moved, so a second run over the
      # freshly written files must report no change at all. If it does not, the output is
      # not deterministic and every future run would churn the diff.
      - name: Check the output is stable
        if: steps.generate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cp -r src "$RUNNER_TEMP/src-first"
          dotnet run --project src/DiagnosticCatalog.Cli -c Release -v minimal -- generate \
            --manifest eng/catalogs.json
          if ! diff -r "$RUNNER_TEMP/src-first" src > "$RUNNER_TEMP/stability.diff"; then
            echo "::error::Regeneration is not deterministic; a second run changed the output."
            head -50 "$RUNNER_TEMP/stability.diff"
            exit 1
          fi

      # Part of what the documentation states is derived from the catalogues — the release each one
      # mirrors, the rule counts of the specification's table, the package survey — and
      # documentation tests hold it to them. Nothing connects a regenerated catalogue to those
      # pages, so a sync that moves a mirrored version leaves them behind and the pull request
      # opens red. Run the same tests here so the pull request SAYS so, in its body, naming the
      # pages, instead of leaving a reviewer to decode a red check. It must not stop the job:
      # the pull request is how a person finds out, and a failed job opens none.
      - name: Check the documentation still agrees
        id: docs
        if: steps.generate.outputs.changed == 'true'
        run: |
          set -uo pipefail
          if dotnet test tests/DiagnosticCatalog.Documentation.UnitTests -c Release --nologo \
               > "$RUNNER_TEMP/docs-check.log" 2>&1; then
            echo 'stale=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'stale=true' >> "$GITHUB_OUTPUT"
          # One line per distinct complaint: the message follows its "Error Message:" marker.
          awk '/Error Message:/ { getline; sub(/^[[:space:]]+/, ""); if (!seen[$0]++) print "- " $0 }' \
            "$RUNNER_TEMP/docs-check.log" | head -30 > "$RUNNER_TEMP/docs-stale.md"
          echo "::warning::The documentation no longer agrees with the regenerated catalogues."
          cat "$RUNNER_TEMP/docs-stale.md"

      - name: Open or update the pull request
        if: steps.generate.outputs.changed == 'true' || inputs.force-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty when force-pr opened a pull request with nothing changed, which is why the
          # reminder below is written only when it is not.
          TRAINS: ${{ steps.generate.outputs.trains }}
          # Trains whose only change is the mirrored upstream version. Listed in the body as
          # "not to tag", so the absence of a command reads as a decision and not an omission.
          MIRROR_ONLY: ${{ steps.generate.outputs.mirror_only }}
          # 'true' when the documentation tests failed against the regenerated catalogues.
          DOCS_STALE: ${{ steps.docs.outputs.stale }}
        run: |
          set -euo pipefail
          # shellcheck source=tools/trains.sh
          . tools/trains.sh
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout -B "$SYNC_BRANCH"
          git add -- src/
          if git diff --cached --quiet; then
            echo 'Nothing staged; force-pr was requested with no changes. Skipping.'
            exit 0
          fi

          SUMMARY="$(cat "$RUNNER_TEMP/summary.md")"
          git commit -q -m "chore: sync generated catalogues with upstream analyzers" \
                        -m "$SUMMARY"

          # The catalogue content is derived, so the latest regeneration always wins over
          # whatever the branch held before.
          #
          # The lease is spelled out. A bare --force-with-lease trusts only a remote-tracking
          # ref that a configured fetch refspec covers, and actions/checkout configures none
          # for this branch, so git sees no expected value and rejects the push as "stale
          # info" whenever an earlier run left the branch behind. This has caused every
          # subsequent run to fail since the sync branch was first created. The expected
          # value is the tip as of now, or empty (the branch must not exist) when there
          # is none.
          EXPECTED="$(git ls-remote --heads origin "refs/heads/$SYNC_BRANCH" | cut -f1)"
          git push --force-with-lease="$SYNC_BRANCH:$EXPECTED" origin "$SYNC_BRANCH"

          # Quoted heredocs ('EOF'), so the body is written verbatim: it is Markdown, and its
          # backticks and $ signs must reach the pull request rather than be read as command
          # substitutions. The summary is interleaved between the two because it is a file the
          # generator wrote, not a literal.
          #
          # Every line here — heredoc bodies and terminators included — sits at this block's
          # own indentation, which YAML strips wholesale: that is what puts the terminators in
          # column 1 for the shell and leaves the Markdown unindented. A line dedented past it
          # does not merely look wrong, it ends the block scalar and the file stops parsing.
          BODY_FILE="$RUNNER_TEMP/body.md"
          cat > "$BODY_FILE" <<'EOF'
          Regenerated from the upstream analyzer packages by the nightly catalogue
          sync workflow (`.github/workflows/nightly-catalogs.yml`).

          **Review this diff, do not merge it blind.** A category or an id that moved
          upstream changes a published contract, and because the .NET platform never
          reads a suppression's category, a wrong value merged here would produce no
          symptom anywhere (specification §3.2).

          EOF
          cat "$RUNNER_TEMP/summary.md" >> "$BODY_FILE"
          # The release reminder. Built with printf rather than a heredoc because it
          # interpolates the train names, and the quoted heredocs above exist precisely to
          # stop interpolation: single-quoted printf formats keep backticks and $ literal
          # while %s carries the values in.
          #
          # Tags are fetched explicitly — actions/checkout does not bring them, and without
          # them every train would report "never published" on a repository that has in fact
          # published all four.
          # SC2016 fires on every backtick and $ inside these single-quoted formats, which is
          # precisely what they are for: the backticks are Markdown and must reach the pull
          # request as characters, not be read as command substitution. Disabling it here is
          # the same call the quoted heredocs above make, for the same reason.
          # shellcheck disable=SC2016
          if [ -n "$TRAINS" ]; then
            git fetch --tags --force --quiet origin
            {
              printf '\n### After merging\n\n'
              printf 'Merging this publishes nothing. Until each train below is tagged, `main`\n'
              printf 'and the package on nuget.org describe different rule sets, and no check\n'
              printf 'anywhere reports the gap.\n'
            } >> "$BODY_FILE"
            for train in $TRAINS; do
              prefix="$(prefix_of "$train")"
              package="$(basename "$(projects_of "$train")" .csproj)"
              latest="$(git tag --list "${prefix}*" --sort=-v:refname | head -1)"
              {
                printf '\n**`%s`** — last published: `%s`\n\n' "$train" "${latest:-none}"
                printf '    git tag -a %sX.Y.Z -m "%s X.Y.Z"\n' "$prefix" "$package"
                printf '    git push origin %sX.Y.Z\n' "$prefix"
              } >> "$BODY_FILE"
            done
            printf '\nThe version is left blank on purpose: whether a sync is a patch or a minor\n' >> "$BODY_FILE"
            printf 'depends on what actually moved, and a pre-filled number invites pasting.\n' >> "$BODY_FILE"
          fi

          # Word splitting is the point: MIRROR_ONLY is a space-separated list of train ids.
          # shellcheck disable=SC2016,SC2086
          if [ -n "$MIRROR_ONLY" ]; then
            {
              printf '\n### Not to tag\n\n'
              printf 'No rule moved in: %s.\n\n' "$(printf '`%s`, ' $MIRROR_ONLY | sed 's/, $//')"
              printf 'Only the mirrored upstream version changed, which moves no version\n'
              printf '(specification §14.2). It reaches consumers with the next release of the train\n'
              printf 'that has something to say.\n'
            } >> "$BODY_FILE"
          fi

          if [ "${DOCS_STALE:-}" = 'true' ]; then
            {
              printf '\n### Documentation to update\n\n'
              printf 'The documentation tests fail against these catalogues, so this pull request is\n'
              printf 'red until the pages below follow them. Update them on this branch:\n\n'
              cat "$RUNNER_TEMP/docs-stale.md"
              printf '\nThe next run of this job rewrites the branch, so a fix pushed here is lost unless\n'
              printf 'this pull request is merged first.\n'
            } >> "$BODY_FILE"
          fi

          cat >> "$BODY_FILE" <<'EOF'

          ---

          - Ids and categories are read from each analyzer's own `DiagnosticDescriptor`
            instances, never from documentation (§14.1).
          - Rules retired upstream are kept and marked `[Obsolete]`, never deleted:
            consumers inline constants, so removing one breaks their recompilation (§23.1).
          - No package is published by this job.
          EOF

          # Only an OPEN pull request is the one to update. `gh pr view <branch>`, which this used,
          # falls back to a merged or closed pull request when the branch has none open, and that is
          # the normal state here the night after a merge: the job recreates the branch, and the
          # only pull request it ever had is the merged one. So every run after the first sync pull
          # request was merged edited that one instead of opening a new one — eleven nights of
          # upstream releases reported on a page nobody opens again, with the job green throughout.
          #
          # The pull request must come from this repository's own branch. A fork can open one from
          # a branch of the same name, and the job would otherwise write its report there.
          OPEN_PR="$(gh pr list --head "$SYNC_BRANCH" --state open --json number,isCrossRepository \
                       --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')"
          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" \
              --title 'chore: sync generated catalogues with upstream analyzers' \
              --body-file "$BODY_FILE"
            echo "Updated existing pull request #$OPEN_PR."
          else
            gh pr create \
              --head "$SYNC_BRANCH" \
              --title 'chore: sync generated catalogues with upstream analyzers' \
              --body-file "$BODY_FILE"
          fi

      - name: Report no change
        if: steps.generate.outputs.changed != 'true'
        run: echo 'Every upstream package still resolves to the version already mirrored. Nothing to do.'

      # This job ran red for 64 nights without anyone being told: nothing in it reaches a person when
      # it fails, and a failed run opens no pull request, so the only trace was a column of red crosses
      # in the Actions tab. This says so, in Slack, the moment it happens.
      #
      # The channel is not named here. An incoming webhook is bound to one channel when it is created in
      # Slack, and its URL is the secret SLACK_WEBHOOK_URL of this repository. Without the secret the
      # step says so in the log and passes: an alert that cannot be sent must not turn a failure that was
      # already reported into a second one, and merging this before the secret exists breaks nothing.
      #
      # It names the run rather than the step that failed: listing a job's steps needs the `actions: read`
      # scope, and this job is deliberately limited to the two it has.
      - name: Tell Slack the sync failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo '::warning::SLACK_WEBHOOK_URL is not set, so nobody was told that the catalogue sync failed.'
            exit 0
          fi

          # shellcheck disable=SC2016  # the backticks are Slack's code markup, not a command substitution.
          text="$(printf ':rotating_light: *Nightly catalogue sync failed* in `%s`\n%s\nRun: <%s|#%s> (%s, commit `%s`)\nNo catalogue is regenerated and no pull request is opened until it passes again. Open the run and read the red step.' \
            "$REPOSITORY" 'The upstream analyzers are no longer being mirrored.' "$RUN_URL" "$RUN_NUMBER" "$EVENT" "${SHA:0:7}")"

          curl --silent --show-error --fail-with-body --max-time 30 \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg text "$text" '{text: $text}')" \
            "$SLACK_WEBHOOK_URL"
